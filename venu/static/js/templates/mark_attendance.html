
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container my-4">
    <div class="card p-4 shadow-sm">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center">
            <h4>Mark Attendance</h4>
            <div>
                <button id="startmarkBtn" class="btn btn-primary">Start</button>
                <button id="stopmarkBtn" class="btn btn-danger" disabled>Stop</button>
            </div>
        </div>

        <!-- Content -->
        <div class="row mt-3">

            <!-- Camera -->
            <div class="col-md-7 text-center">
                <video id="markvideo" width="560" height="420" autoplay muted
                       style="border-radius:10px;border:2px solid #e2e8f0;">
                </video>

                <div id="markStatus" class="mt-2 small text-muted">
                    Waiting...
                </div>
            </div>

            <!-- Recognized List -->
            <div class="col-md-5">
                <h6>Recognized (session)</h6>
                <ul id="recognizedLi" class="list-group"></ul>
            </div>

        </div>
    </div>
</div>

<!-- JS -->
<script src="{{ url_for('static', filename='js/camera_mark.js') }}"></script>

</body>
</html>
