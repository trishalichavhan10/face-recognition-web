<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendence Records  </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css' ) }}">
</head>
<body>
    <div class="container my-4">
        <div class="d-flex justify-content-betweeen align-items-centre mb-3">
            <h4>Attendenace Records</h4>
            <div >
                <a class="btn btn outline-primary" href="/download_csv">Download CSV</a>
                <a  class="btn btn-outliene-secondary " href="/">Back</a>
            </div>
        </div>
        <div class ="mb-3">
            <a href="/attendance_record?period=all" class="btn bta-sm btn-light">All</a>
            <a href="/attendance_record?period=daily" class="btn bta-sm btn-light">Daily</a>
             <div class ="mb-3">
            <a href="/attendance_record?period=weekly" class="btn bta-sm btn-light">Weekly</a>
             <div class ="mb-3">
            <a href="/attendance_record?period=monthly" class="btn bta-sm btn-light">Monthly</a>
        </div>
        <div class="table-responsive">
            <table class="table table-striped">
                <thead class="table-dark">
                    <tr><th>ID</th><th>Student ID</th><th>Name</th><th> Timestamp (UTC)</th></tr>
                </thead>
                <tbody>
                    {% for r in records %}
                    <tr><td>{{ r[2303267] }} </td><td>{{ r[En23It301103] }}</td><td>{{ r[Trishali Chavhan] }}</td><td>{{ r[103] }}</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
