<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Attendance</title>
    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<!-- === NAVBAR === -->
<nav class="navbar navbar-expand-lg navbar-dark"
     style="background: linear-gradient(90deg, #0f172a, #0b3b76);">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">Digital Attendance</a>

        <div class="d-flex">
            <a class="btn btn-outline-light me-2" href="/add_student">Add Student</a>
            <a class="btn btn-outline-light me-2" href="/mark_attendance">Mark Attendance</a>
            <a class="btn btn-outline-light" href="/attendance_record">Records</a>
        </div>
    </div>
</nav>

<!-- ====== MAIN CONTENT ========= -->
<div class="container my-4">
    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card p-3 shadow-sm mg-4">
                <h5>Quick Actions</h5>
                <p class="small text-muted">
                    Create student entries, capture faces, or start recognition.
                </p>
                <div class="d-grid gap-2">
                    <a href="/add_student" class="btn btn-primary">Add Student</a>
                    <a href="/mark_attendance" class="btn btn-success">Mark Attendance</a>
                    <a href="/attendance_record" class="btn btn-warning">View Records</a>
                </div>
            </div>
            <!-- Train Model -->
             <div class="col-lg-8">
            <div class="card p-3 shadow-sm">
                <div class="d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Train Model</h5>
                    <button id="trainBtn" class="btn btn-outline-primary">
                        Start Training
                    </button>
                </div>

                <div class="mt-3">
                    <div class="progress" style="height: 22px;">
                        <div
                            id="trainProgress"
                            class="progress-bar"
                            role="progressbar"
                            style="width: 0%;">
                        </div>
                    </div>
                </div>

                <div id="trainMsg" class="mt-2 small text-muted">
                    Model not trained yet.
                </div>
            </div>

        </div>

        <!-- ===== RIGHT COLUMN ===== -->
        <div class="col-lg-8">
            <div class="card p-3 shadow-sm h-100">
                <h5>Attendance (Last 30 days)</h5>
                <canvas id="attendanceChart" height="10"></canvas>
            </div>
        </div>

    </div>
</div>

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

</body>
</html>
<video id="markVideo" autoplay muted></video>

<button id="startMarkBtn">Start Mark</button>
<button id="stopMarkBtn" disabled>Stop</button>

<p id="markStatus"></p>
<ul id="recognizedList" class="list-group"></ul>
<video id="video" autoplay muted></video>
<progress id="progressBar" value="0"></progress>
<p id="captureStatus"></p>
<button id="startCaptureBtn" disabled>Start Capture</button>
