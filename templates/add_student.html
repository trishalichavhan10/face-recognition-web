<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Student — FRA</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="logo-container">
                <div class="logo-icon"><i class="bi bi-camera"></i></div>
                <div>
                    <div class="logo-text">FRA</div>
                    <div class="logo-sub">Face Recognition<br>Attendance</div>
                </div>
            </div>
            <nav>
                <a href="/"><i class="bi bi-grid-1x2"></i> Dashboard</a>
                <a href="/mark_attendance"><i class="bi bi-camera-video"></i> Live Feed</a>
                <a href="/students_list" class="active"><i class="bi bi-person-plus"></i> People DB</a>
                <a href="/attendance_record"><i class="bi bi-file-text"></i> Logs</a>
            </nav>
        </aside>

        <main class="main">
            <div class="page-header">
                <div>
                    <h1>Register Student</h1>
                    <div class="page-sub">Enroll new face into biometric database</div>
                </div>
                <a href="/students_list" class="btn-ghost"><i class="bi bi-arrow-left"></i> Back to Database</a>
            </div>

            <div class="panel" style="max-width:680px;">
                <span class="section-label">Student Information</span>
                <form id="studentForm">
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
                        <div style="grid-column:1/3;">
                            <label class="fra-label">Full Name</label>
                            <input class="fra-input" name="name" required placeholder="e.g. Trishali Chavhan">
                        </div>
                        <div>
                            <label class="fra-label">Roll No.</label>
                            <input class="fra-input" name="roll" placeholder="301103">
                        </div>
                        <div>
                            <label class="fra-label">Reg. No.</label>
                            <input class="fra-input" name="reg_no" placeholder="EN23IT301103">
                        </div>
                        <div>
                            <label class="fra-label">Class</label>
                            <input class="fra-input" name="class" placeholder="IT-B">
                        </div>
                        <div>
                            <label class="fra-label">Section</label>
                            <input class="fra-input" name="sec" placeholder="B2">
                        </div>
                    </div>
                    <div style="display:flex;gap:12px;flex-wrap:wrap;">
                        <button id="saveInfoBtn" type="submit" class="btn-primary"><i class="bi bi-save"></i> Save
                            Details</button>
                        <button id="startCaptureBtn" type="button" class="btn-warning" disabled><i
                                class="bi bi-camera"></i> Start Capture</button>
                        <button id="addStudentBtn" type="button" class="btn-cyan" disabled><i
                                class="bi bi-cloud-arrow-up"></i> Upload Images</button>
                    </div>
                </form>

                <div style="border-top:1px solid rgba(255,255,255,0.05);margin-top:24px;padding-top:20px;">
                    <span class="section-label">Biometric Capture</span>
                    <div class="camera-box">
                        <video id="video" height="300" autoplay muted></video>
                    </div>
                    <div style="margin-top:12px;">
                        <div id="captureStatus"
                            style="font-size:11px;font-family:'JetBrains Mono',monospace;color:#4a5270;">
                            AWAITING_CAPTURE: 0 / 50</div>
                        <div class="fra-progress">
                            <div id="progressBar" class="fra-progress-bar" style="width:0%;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script>
        let studentId = null, capturedImages = [], stream = null;
        const video = document.getElementById("video"), startCaptureBtn = document.getElementById("startCaptureBtn"),
            addStudentBtn = document.getElementById("addStudentBtn"), captureStatus = document.getElementById("captureStatus"),
            progressBar = document.getElementById("progressBar"), form = document.getElementById("studentForm");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const fd = new FormData(form);
            try {
                const data = await (await fetch("/add_student", { method: "POST", body: fd })).json();
                if (data.student_id) { studentId = data.student_id; captureStatus.innerText = "SAVED_OK — Click Start Capture"; captureStatus.style.color = "#10b981"; startCaptureBtn.disabled = false; Array.from(form.elements).forEach(el => { if (el !== startCaptureBtn && el !== addStudentBtn) el.disabled = true; }); } else alert(data.error || "Error");
            } catch { alert("Failed"); }
        });

        startCaptureBtn.addEventListener("click", async () => {
            startCaptureBtn.disabled = true;
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true }); video.srcObject = stream;
                let count = 0; const canvas = document.createElement("canvas"), ctx = canvas.getContext("2d");
                video.onloadeddata = () => {
                    canvas.width = video.videoWidth || 560; canvas.height = video.videoHeight || 420;
                    const iv = setInterval(() => { ctx.drawImage(video, 0, 0, canvas.width, canvas.height); canvas.toBlob(blob => { if (!blob) return; capturedImages.push(blob); count++; captureStatus.innerText = `CAPTURING: ${count} / 50`; progressBar.style.width = (count * 2) + "%"; if (count >= 50) { clearInterval(iv); stream.getTracks().forEach(t => t.stop()); addStudentBtn.disabled = false; captureStatus.innerText = "CAPTURE_COMPLETE — Click Upload"; captureStatus.style.color = "#22d3ee"; } }, "image/jpeg", 0.9); }, 100);
                };
            } catch (err) { alert("Camera: " + err.message); startCaptureBtn.disabled = false; }
        });

        addStudentBtn.addEventListener("click", async () => {
            if (!studentId || !capturedImages.length) return; addStudentBtn.disabled = true;
            const fd = new FormData(); fd.append("student_id", studentId); capturedImages.forEach((b, i) => fd.append("images[]", b, `${i}.jpg`));
            try { captureStatus.innerText = "UPLOADING_DATA ..."; captureStatus.style.color = "#a78bfa"; const data = await (await fetch("/upload_face", { method: "POST", body: fd })).json(); alert("Uploaded " + data.saved + " images!"); window.location.href = "/"; }
            catch { captureStatus.innerText = "ERROR: UPLOAD_FAILED"; captureStatus.style.color = "#f87171"; addStudentBtn.disabled = false; }
        });
    </script>
</body>

</html>
