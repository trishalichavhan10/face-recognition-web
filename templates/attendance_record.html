<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Records</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body style="background:#f3f6f9;">

<div class="container my-5">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 style="font-weight:700; color:#0f172a;"><i class="bi bi-clipboard-data" style="color:#4f46e5;"></i> Attendance Logs</h3>

        <div>
            <a class="btn btn-primary shadow-sm me-2 fw-bold" style="border-radius:10px; background:linear-gradient(135deg, #10b981, #34d399); border:none;" href="/download_csv"><i class="bi bi-download"></i> Export CSV</a>
            <a class="btn btn-light shadow-sm me-2 fw-bold" style="border-radius:10px; color:#4f46e5;" href="/mark_attendance"><i class="bi bi-camera-video"></i> Check-In</a>
            <a class="btn btn-secondary shadow-sm fw-bold border-0" href="/" style="border-radius:10px; background:#e2e8f0; color:#475569;"><i class="bi bi-arrow-left"></i> Dashboard</a>
        </div>
    </div>

    <!-- FILTERS -->
    <div class="mb-4 d-flex flex-wrap gap-2">
        <a href="/attendance_record" class="btn btn-filter active px-4" style="border-radius:20px; background:#4f46e5; color:#fff;">All Logs</a>
        <a href="/attendance_record?period=daily" class="btn btn-light px-4 shadow-sm" style="border-radius:20px; color:#64748b; font-weight:600;">Daily</a>
        <a href="/attendance_record?period=weekly" class="btn btn-light px-4 shadow-sm" style="border-radius:20px; color:#64748b; font-weight:600;">Weekly</a>
        <a href="/attendance_record?period=monthly" class="btn btn-light px-4 shadow-sm" style="border-radius:20px; color:#64748b; font-weight:600;">Monthly</a>
    </div>

    <!-- TABLE -->
    <div class="card shadow-sm p-4" style="border-radius:24px; border:none; background:#ffffff;">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead style="background:#f8fafc; border-bottom:2px solid #e2e8f0;">
                    <tr>
                        <th style="color:#64748b; font-weight:600; text-transform:uppercase; font-size:13px; border:none; padding:15px;">#</th>
                        <th style="color:#64748b; font-weight:600; text-transform:uppercase; font-size:13px; border:none; padding:15px;">ID</th>
                        <th style="color:#64748b; font-weight:600; text-transform:uppercase; font-size:13px; border:none; padding:15px;">Student Name</th>
                        <th style="color:#64748b; font-weight:600; text-transform:uppercase; font-size:13px; border:none; padding:15px;">Date</th>
                        <th style="color:#64748b; font-weight:600; text-transform:uppercase; font-size:13px; border:none; padding:15px;">Time</th>
                    </tr>
                </thead>
                <tbody style="border-top:none;">
                {% for r in records %}
                    <tr>
                        <td style="padding:15px; font-weight:500; color:#94a3b8; border-color:#f1f5f9;">{{ r[0] }}</td>
                        <td style="padding:15px; font-weight:600; color:#0f172a; border-color:#f1f5f9;">{{ r[1] }}</td>
                        <td style="padding:15px; font-weight:600; color:#4f46e5; border-color:#f1f5f9;">
                            <div class="d-flex align-items-center gap-2">
                                <div style="width:32px; height:32px; border-radius:50%; background:#e0e7ff; color:#4f46e5; display:flex; align-items:center; justify-content:center; font-size:14px;">
                                    {{ r[2][0] }}
                                </div>
                                {{ r[2] }}
                            </div>
                        </td>
                        <!-- Split timestamp -->
                        <td style="padding:15px; color:#475569; font-weight:500; border-color:#f1f5f9;"><i class="bi bi-calendar-check text-muted me-1"></i> {{ r[3][:10] }}</td>
                        <td style="padding:15px; color:#475569; font-weight:500; border-color:#f1f5f9;"><i class="bi bi-clock text-muted me-1"></i> {{ r[3][11:19] }}</td>
                    </tr>
                {% else %}
                    <tr>
                        <td colspan="5" class="text-center py-5 text-muted fw-bold">
                            <i class="bi bi-inbox fs-1 d-block mb-2 mt-3 text-secondary"></i>
                            No attendance records found
                        </td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
