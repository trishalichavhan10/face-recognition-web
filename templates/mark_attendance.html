<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body style="background:#f3f6f9;">

<div class="container my-5">
    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 style="font-weight:700; color:#0f172a;"><i class="bi bi-camera-video-fill" style="color:#4f46e5;"></i> Live Face Check-In</h3>
        <div>
            <a class="btn btn-light shadow-sm me-2 fw-bold" href="/attendance_record" style="border-radius:10px;"><i class="bi bi-clipboard-data"></i> View Logs</a>
            <a class="btn btn-secondary shadow-sm fw-bold" href="/" style="border-radius:10px;"><i class="bi bi-arrow-left"></i> Back</a>
        </div>
    </div>

    <!-- MAIN CAMERA CARD -->
    <div class="camera-container text-center">
        <video id="video" width="100%" height="450" autoplay muted></video>

        <div class="d-flex justify-content-center gap-3 mt-4">
            <button id="startBtn" class="btn btn-primary btn-lg shadow-sm" style="border-radius:12px;">
                <i class="bi bi-play-fill"></i> Start Camera
            </button>
            <button id="markBtn" class="btn btn-success btn-lg shadow-sm" style="border-radius:12px;" disabled>
                <i class="bi bi-person-view"></i> Mark Attendance
            </button>
        </div>

        <div class="mt-4">
            <h5 id="statusText" class="text-muted fw-bold" style="color:#64748b;">
                Waiting for camera...
            </h5>
        </div>
    </div>
</div>

<script>
let video = document.getElementById("video");
let startBtn = document.getElementById("startBtn");
let markBtn = document.getElementById("markBtn");
let statusText = document.getElementById("statusText");

let stream = null;

startBtn.addEventListener("click", async () => {
    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;

        statusText.innerText = "✅ Camera started";
        markBtn.disabled = false;
        startBtn.disabled = true;

    } catch (err) {
        alert("Camera error: " + err.message);
    }
});

markBtn.addEventListener("click", async () => {
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0);

    const blob = await new Promise(resolve =>
        canvas.toBlob(resolve, "image/jpeg")
    );

    const formData = new FormData();
    formData.append("image", blob);

    statusText.innerText = "🔍 Recognizing...";
    statusText.style.color = "#4f46e5";

    try {
        const res = await fetch("/recognize_face", {
            method: "POST",
            body: formData
        });

        const data = await res.json();

        if (data.recognized) {
            statusText.innerHTML = "✅ Attendance marked for <strong>" + data.name + "</strong>";
            statusText.style.color = "#10b981";

            if (data.message) {
                statusText.innerText += " (" + data.message + ")";
            }

        } else {
            statusText.innerText = "❌ Face not recognized";
            statusText.style.color = "#ef4444";
        }

    } catch (err) {
        statusText.innerText = "❌ Error detecting face";
        statusText.style.color = "#ef4444";
    }
});
</script>

</body>
</html>
